version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: wheel-mysql
    restart: always
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci 
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - wheel_net

  backend:
    build: ./backend
    container_name: wheel-backend
    restart: always
    depends_on:
      - mysql
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "8081:8080"
    networks:
      - wheel_net

  frontend:
    build: ./frontend
    container_name: wheel-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:80"
    networks:
      - wheel_net

networks:
  wheel_net:
    driver: bridge

volumes:
  mysql_data: